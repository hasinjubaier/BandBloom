version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bandbloom-postgres
    restart: always
    environment:
      POSTGRES_DB: bandbloom_db
      POSTGRES_USER: bandbloom_user
      POSTGRES_PASSWORD: bandbloom_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandbloom_user -d bandbloom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bandbloom-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
